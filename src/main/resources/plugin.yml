name: motd-enhanced
version: $version
description: Edit your MOTD and server icon with a local web editor without restarting your server
author: peyaj
website: https://github.com/realpeyaj/motd-enhanced

main: dev.peyaj.motdenhanced.MOTDEnhancedPlugin
api-version: '26.1'
folia-supported: true

commands:
  motd-enhanced:
    description: Open the web editor, apply the MOTD, copy one from another server, reload, or toggle maintenance.
    usage: "/motd <editor|apply|reload|get|maintenance>"
    aliases: [motd]
    permission: motdenhanced

permissions:
  motdenhanced:
    description: Full access to the MOTD editor and commands.
    default: op
  motdenhanced.editor:
    description: Permission to open and edit the MOTD via the local web editor.
    default: op
  motdenhanced.apply:
    description: Permission to apply MOTD changes.
    default: op
  motdenhanced.reload:
    description: Permission to reload the plugin configuration.
    default: op
  motdenhanced.maintenance:
    description: Permission to toggle server maintenance mode.
    default: op